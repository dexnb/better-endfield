name: Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and platform
        run: |
          sdkmanager --install "platforms;android-37.0" "ndk;$NDK_VERSION" "build-tools;35.0.0"
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ln -sfn "$sdk/platforms/android-37.0" "$sdk/platforms/android-37"
          ls -1 "$sdk/platforms"

      - name: Download core package
        run: |
          set -euo pipefail
          core=$(python3 - <<'PY'
          import json
          revisions = json.load(open('config/resource-packs.json'))['revisions']['core']['android']
          source = json.load(open('android/resources/resource-source.json'))
          game = (source.get('provenance') or {}).get('gameVersion') or source.get('gameVersion')
          print(f"{game}.{revisions[game]}")
          PY
          )
          echo "core package: $core"
          curl -fsSL -o core.zip \
            "https://github.com/Dr-hydra/Better-Endfield/releases/download/game-resources/BE-Core-Android-$core.zip"
          ls -lh core.zip

      - name: Restore generated inputs
        run: pwsh ./scripts/ci/fetch-core.ps1 -Platform android -Archive core.zip

      - name: Build APK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "$sdk"
          printf '{"schema_version": 1, "tools": {"android_sdk": "%s"}}\n' "$sdk" > ci-workspace.json
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain --no-daemon \
            -PworkspaceConfig="$GITHUB_WORKSPACE/ci-workspace.json"

      - name: Restore signing key
        id: signkey
        uses: actions/cache@v4
        with:
          path: release.jks
          key: better-endfield-keystore-v1

      - name: Create signing key if absent
        if: steps.signkey.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v -keystore release.jks -alias betterendfield \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass betterendfield -keypass betterendfield \
            -dname "CN=BetterEndfield, OU=Dev, O=Dev, L=NA, S=NA, C=CN"

      - name: Sign APK
        run: |
          set -euo pipefail
          apk=$(find build -path '*/outputs/apk/release/*.apk' -type f | head -1)
          test -n "$apk"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/zipalign" -f -p 4 "$apk" aligned.apk
          version=$(python3 -c "import xml.etree.ElementTree as ET;print(ET.parse('Directory.Build.props').getroot().findtext('.//Version'))")
          "$bt/apksigner" sign --ks release.jks --ks-key-alias betterendfield \
            --ks-pass pass:betterendfield --key-pass pass:betterendfield \
            --out "BetterEndfieldNext-$version-arm64-lsposed.apk" aligned.apk
          ls -lh *.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lsposed-latest
          name: Better-Endfield Next（LSPosed / libxposed 102）
          body: |
            上游原版代码直接构建，未做任何修改。
            适用于 LSPosed / Vector（libxposed API 102）。
          prerelease: false
          make_latest: true
          files: "BetterEndfieldNext-*-lsposed.apk"
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
